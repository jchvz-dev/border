<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download border</title>

  <!-- This URL is shared from inside the app (drawer/content.tsx) and is
       linked from elsewhere, so it must keep resolving. Rather than maintain a
       second copy of the store links, it forwards to the download section of
       the main page — one source of truth.

       meta refresh rather than JS: GitHub Pages has no server-side redirects,
       and this still works with JS disabled. The canonical tag keeps search
       engines pointed at the real page instead of indexing this stub. -->
  <meta http-equiv="refresh" content="0; url=./#download" />
  <link rel="canonical" href="https://nebu-labs.com/border/" />
  <meta name="robots" content="noindex" />

  <style>
    :root{ --bg:#ffffff; --fg:#0b0d12; --brand:#0055ff; }
    @media (prefers-color-scheme: dark){ :root{ --bg:#0b0d12; --fg:#f2f4f8; } }
    body{
      background:var(--bg); color:var(--fg); margin:0; min-height:100svh;
      display:grid; place-items:center; text-align:center; padding:24px;
      font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    a{ color:var(--brand) }
  </style>
</head>
<body>
  <!-- Only seen if the refresh is blocked. -->
  <p>Taking you to the download options… <a href="./#download">Continue</a></p>
</body>
</html>
